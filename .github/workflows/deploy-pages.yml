name: Deploy Pages

# Builds the public landing page and the static dashboard demo into a single
# Pages site:
#   /OutlierQ/       -> landing/
#   /OutlierQ/demo/  -> dashboard/ built with VITE_DEMO_MODE=true
#
# Pull requests build but do not deploy, so a broken build fails on the PR
# rather than on the live site.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            landing/package-lock.json
            dashboard/package-lock.json

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          # Sets the Pages source to GitHub Actions on the first run so the
          # deploy does not require a manual visit to repo Settings.
          enablement: true

      - name: Install landing deps
        working-directory: landing
        run: npm ci

      - name: Install dashboard deps
        working-directory: dashboard
        run: npm ci

      # Explicit typecheck gates. The build scripts also run tsc, but asserting
      # it here means a package.json change can never silently drop the check.
      - name: Typecheck landing
        working-directory: landing
        run: npx tsc --noEmit

      - name: Typecheck dashboard
        working-directory: dashboard
        run: npx tsc --noEmit

      - name: Build landing
        working-directory: landing
        run: npm run build

      - name: Build dashboard demo
        working-directory: dashboard
        run: npm run build:demo

      - name: Assemble _site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/demo
          cp -R landing/dist/. _site/
          cp -R dashboard/dist-demo/. _site/demo/
          # Without .nojekyll, Pages strips paths beginning with an underscore,
          # which breaks Vite's asset output.
          touch _site/.nojekyll
          # Routing fallback for unknown paths.
          cp _site/index.html _site/404.html

      - name: Verify demo bundle has no live-API references
        run: |
          set -euo pipefail
          if grep -rEi 'FINNHUB|KALSHI|BEGIN RSA|localhost:8000' _site/demo/; then
            echo "::error::demo bundle contains a secret or live-API reference"
            exit 1
          fi
          echo "demo bundle clean"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
