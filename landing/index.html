<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#05070b" />

    <title>OutlierQ — Event-driven trading-signal research</title>
    <meta
      name="description"
      content="OutlierQ is an open research platform for event-driven trading signals: news anomaly detection, calibrated options signals, prediction-market arbitrage, and graded paper-trading results. Every figure shown is synthetic. Research only — not financial advice."
    />

    <!-- Absolute URLs below are required by crawlers, so the origin is written out
         here. %BASE_URL% is substituted by Vite from `base` in vite.config.ts; if
         the site moves to a custom domain, change `base` there and the four
         absolute URLs in this file. -->
    <link rel="canonical" href="https://aarinb1.github.io/OutlierQ/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OutlierQ" />
    <meta property="og:url" content="https://aarinb1.github.io/OutlierQ/" />
    <meta property="og:title" content="OutlierQ — Event-driven trading-signal research" />
    <meta
      property="og:description"
      content="News anomaly detection, calibrated options signals, prediction-market arbitrage, and graded paper-trading results. Interactive demo runs on synthetic data. Not financial advice."
    />
    <meta property="og:image" content="https://aarinb1.github.io/OutlierQ/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="OutlierQ — an open research platform for event-driven trading signals. All figures synthetic."
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OutlierQ — Event-driven trading-signal research" />
    <meta
      name="twitter:description"
      content="News anomaly detection, calibrated options signals, prediction-market arbitrage, and graded paper-trading results. Interactive demo runs on synthetic data. Not financial advice."
    />
    <meta name="twitter:image" content="https://aarinb1.github.io/OutlierQ/og.png" />
    <meta
      name="twitter:image:alt"
      content="OutlierQ — an open research platform for event-driven trading signals. All figures synthetic."
    />

    <!-- Icons -->
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%BASE_URL%favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" sizes="180x180" />

    <!-- Fonts: self-hosted latin variable subsets, same origin, nothing
         render-blocking. Only IBM Plex Sans is preloaded — it renders the h1,
         which is the LCP element. JetBrains Mono is deliberately NOT preloaded:
         preloading it too put 31 kB ahead of the JS bundle on a throttled link
         and cost 124 ms of median LCP (1460 ms -> 1336 ms when removed) with no
         CLS either way, measured over three cold loads at 1.6 Mbps / 4x CPU.
         The latin-ext face is fetched only if a non-latin glyph is needed. -->
    <link
      rel="preload"
      href="%BASE_URL%fonts/ibm-plex-sans-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      /* IBM Plex Sans — variable weight 400..700 */
      @font-face {
        font-family: "IBM Plex Sans";
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url("%BASE_URL%fonts/ibm-plex-sans-latin-var.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
          U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "IBM Plex Sans";
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url("%BASE_URL%fonts/ibm-plex-sans-latin-ext-var.woff2") format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF,
          U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020,
          U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      /* JetBrains Mono — variable weight 400..600 */
      @font-face {
        font-family: "JetBrains Mono";
        font-style: normal;
        font-weight: 400 600;
        font-display: swap;
        src: url("%BASE_URL%fonts/jetbrains-mono-latin-var.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
          U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }
      /* Painted before the CSS bundle arrives so there is never a white flash. */
      html {
        background: #05070b;
        color-scheme: dark;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
